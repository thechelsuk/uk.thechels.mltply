name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static site files
        run: |
          test -s index.html
          test -s styles.css
          test -s CNAME
          test -s robots.txt
          test -s sitemap.xml
          test -s images/mltply-icon.png
          test -s images/og-image.png
          test -s images/app-store-badge.svg
          test -s images/buddy.png
          test -s images/paper.jpg
          test -s images/01-chat.jpg
          test -s images/02-timed.jpg
          test -s images/03-settings.jpg
          test -s images/04-achievements.jpg
          test -s images/05-scoreboard.jpg

      - name: Assemble Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/images
          cp index.html styles.css CNAME robots.txt sitemap.xml _site/
          cp images/mltply-icon.png images/og-image.png images/app-store-badge.svg images/buddy.png images/paper.jpg images/01-chat.jpg images/02-timed.jpg images/03-settings.jpg images/04-achievements.jpg images/05-scoreboard.jpg _site/images/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
